name: Feature
about: Plan a GitHubExplorer feature
labels: [enhancement]
body:
  - type: input
    id: ticket
    attributes:
      label: Ticket
      placeholder: GE-XXX
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user or engineering problem are we solving?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: technical
    attributes:
      label: Technical notes

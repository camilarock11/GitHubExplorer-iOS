name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -version

          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data=json.load(sys.stdin); devices=[d for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator: $SIMULATOR_UDID"

          xcodebuild \
            -project GitHubExplorer.xcodeproj \
            -scheme GitHubExplorer \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            clean test \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES
